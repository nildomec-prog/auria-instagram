name: Validar calendario

on:
  push:
    paths:
      - "calendario.json"
      - "respuestas_dm.json"
      - "media/**"
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/validar.py
